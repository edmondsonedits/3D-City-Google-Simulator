<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Dispatch Prototype v0.0.17</title></head>
<body>
<script>
(async()=>{const response=await fetch('./dispatch-prototype-v0.0.9.html',{cache:'no-store'});if(!response.ok)throw new Error(`Unable to load prototype shell (${response.status})`);let html=await response.text();html=html.replaceAll('Dispatch Prototype v0.0.9','Dispatch Prototype v0.0.17').replaceAll('dispatch-prototype-v0.0.9','dispatch-prototype-v0.0.17').replaceAll('DISPATCH PROTOTYPE · v0.0.9','DISPATCH PROTOTYPE · v0.0.17').replaceAll('VERSION 0.0.9 · DISPATCH INTEGRATION PROTOTYPE','VERSION 0.0.17 · DISPATCH INTEGRATION PROTOTYPE').replace('<span id="version-pill" class="pill">v0.0.8</span>','<span id="version-pill" class="pill">v0.0.17</span>').replace('<script type="module" src="./app.js?v=0.0.8"><\/script>','<script type="module" src="./app-dispatch-v0.0.17.js?v=0.0.17"><\/script>');document.open();document.write(html);document.close();})().catch(error=>{document.body.innerHTML=`<main style="font:16px system-ui;padding:24px"><h1>Dispatch prototype could not start</h1><pre>${String(error.message||error)}</pre></main>`;});
</script>
</body></html>
