name: Test and deploy 3D City demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run vehicle physics tests
        run: npm test
      - name: Validate dispatch prototype modules
        run: |
          node --check app-dispatch-v0.0.15.js
          node --check dispatch/ems-transport-v0.0.15.js
          node --check dispatch/incident-spatial-v0.0.14.js
          node --check dispatch/dispatch-gameplay-v0.0.13.js
      - name: Install browser tests
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-renderer fixture tests (not Google validation)
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts/

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
