name: Test and deploy 3D City demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run integration and syntax tests
        run: npm test
      - name: Validate production remains isolated and key-free
        run: |
          grep -q 'app.js?v=0.0.8' index.html
          test -f dispatch-prototype-v0.0.40.html
          ! grep -R -E 'AIza[0-9A-Za-z_-]{20,}' --exclude-dir=.git .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run dispatch completion browser tests
        run: npm run test:browser

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
